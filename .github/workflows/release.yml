name: Build & Release APK on Main

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Build installable APK
        run: ./gradlew assembleDebug

      - name: Prepare release version & APK artifact
        id: artifact
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          fi
          APK_NAME="QahwaManager-${TAG}.apk"
          APK_SOURCE=$(find app/build -name "app-debug.apk" | head -n 1)
          cp "${APK_SOURCE}" "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.artifact.outputs.apk_name }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag_name }}
          name: Qahwa Manager ${{ steps.artifact.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.apk_name }}
