name: Build & Release APK on Main

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every release must be signed with the one permanent key, or it can't install over the
      # previous version. Stop here rather than build an APK that can't be published.
      - name: Check signing secrets
        env:
          QAHWA_KEYSTORE_BASE64: ${{ secrets.QAHWA_KEYSTORE_BASE64 }}
          QAHWA_KEYSTORE_PASSWORD: ${{ secrets.QAHWA_KEYSTORE_PASSWORD }}
          QAHWA_KEY_ALIAS: ${{ secrets.QAHWA_KEY_ALIAS }}
          QAHWA_KEY_PASSWORD: ${{ secrets.QAHWA_KEY_PASSWORD }}
          QAHWA_RELEASE_CERT_SHA256: ${{ vars.QAHWA_RELEASE_CERT_SHA256 }}
        run: |
          missing=0
          for name in QAHWA_KEYSTORE_BASE64 QAHWA_KEYSTORE_PASSWORD QAHWA_KEY_ALIAS QAHWA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}"
              missing=1
            fi
          done
          if [ -z "${QAHWA_RELEASE_CERT_SHA256}" ]; then
            echo "::error::Missing repository variable QAHWA_RELEASE_CERT_SHA256"
            missing=1
          fi
          exit "${missing}"

      - name: Compute release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          fi
          # The run number only goes up, so each release can install over the one before it.
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "apk_name=QahwaManager-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          QAHWA_KEYSTORE_BASE64: ${{ secrets.QAHWA_KEYSTORE_BASE64 }}
        run: printf '%s' "${QAHWA_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Run unit tests and build signed release APK
        env:
          QAHWA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          QAHWA_KEYSTORE_PASSWORD: ${{ secrets.QAHWA_KEYSTORE_PASSWORD }}
          QAHWA_KEY_ALIAS: ${{ secrets.QAHWA_KEY_ALIAS }}
          QAHWA_KEY_PASSWORD: ${{ secrets.QAHWA_KEY_PASSWORD }}
        run: >-
          ./gradlew test assembleRelease
          -PversionCode=${{ steps.version.outputs.version_code }}
          -PversionName=${{ steps.version.outputs.tag_name }}

      # Refuse to publish an APK signed with any key but the permanent one (e.g. a test key
      # uploaded by mistake).
      - name: Verify signing certificate
        env:
          QAHWA_RELEASE_CERT_SHA256: ${{ vars.QAHWA_RELEASE_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
          ACTUAL=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "${QAHWA_RELEASE_CERT_SHA256}" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "${ACTUAL}" ] || [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::APK is signed with ${ACTUAL:-no certificate}, expected ${EXPECTED}"
            exit 1
          fi
          echo "Signed with the permanent key (${ACTUAL})"

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_name }}

      # Only main and tags publish. A run dispatched from a branch stops at the artifact above.
      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Qahwa Manager ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk_name }}

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
